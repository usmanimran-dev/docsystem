<div class="layout">

    <!-- TOPBAR -->
    <app-topbar (toggleSidebarEvent)="toggleSidebar()" [collapsed]="collapsed"></app-topbar>

    <div class="body">

        <!-- SIDEBAR -->
        <app-sidebar [collapsed]="collapsed" (collapsedChange)="collapsed = $event"
                     [menuItems]="activeMenu()"></app-sidebar>

        <!-- MAIN CONTENT -->
        <main class="content">
            <router-outlet></router-outlet>
        </main>

    </div>

    <!-- FOOTER -->
    <footer class="footer">
        © 2026 DocuFinder. All Rights Reserved
    </footer>

</div>

spring.application.name=examination-service
server.port=8090

# Bind to the loopback interface only. This service stores every analysis and
# every discrepancy report, and its sanctions import is an unauthenticated POST
# that rewrites the country risk table, so it must not be reachable from the
# network by default. The Angular dev proxy and the production reverse proxy
# both run on the same host and are unaffected.
#
# To expose it deliberately, set SERVER_BIND_ADDRESS=0.0.0.0 - and set
# EXAMINATION_API_KEY at the same time, or it will be open to everyone.
server.address=${SERVER_BIND_ADDRESS:127.0.0.1}

# --- API key -----------------------------------------------------------
# Expected in the X-API-Key header. Supplied by whatever sits in front of this
# service (the dev proxy in proxy.conf.json, the reverse proxy in production,
# or the ingest service) - never by browser code, where it would be readable
# by anyone with developer tools open.
#
# Blank disables the check and logs a warning at startup. That is only safe in
# combination with the loopback binding above.
security.api-key=${EXAMINATION_API_KEY:}

# Own database - never Imad's `edms` database, never his collections.
spring.data.mongodb.uri=mongodb://localhost:27017/edms_examine

# --- Module toggles ---
# One build, different .properties file per deployment. Same pattern
# Imad's clientapplication.properties already uses. A client who only
# wants the DMS ships with compliance.enabled=false and this whole
# module never boots.
modules.compliance.enabled=true
modules.extraction.enabled=true

# --- Sanctions data source ---
# Imad's point: the app calling this always hits the same contract
# (GET /compliance/check-country) no matter what. Everything below
# only affects how THIS service fills its own local table - callers
# never see the difference.
#
#   live  = this service syncs from the internet on a schedule
#   local = this service only reads what's already in the database,
#           loaded from an admin-imported file - zero outbound calls,
#           safe for a bank network with no internet access
sanctions.source=live
sanctions.source.url=https://www.opensanctions.org
sanctions.sync.cron=0 0 3 * * *
sanctions.import.folder=./sanctions-import
sanctions.staleness.warn.days=30

# --- Entity-name screening (OpenSanctions) ---
# Real key, read from an environment variable only - never committed here.
# See README for how to set OPENSANCTIONS_API_KEY before starting the JAR.
opensanctions.api.url=https://api.opensanctions.org
opensanctions.api.key=${OPENSANCTIONS_API_KEY:}

# 4300 is the parser UI (edms-parser-ui) - the only app that calls this
# service once the split is finished. 4200 is the DMS app, listed while
# its copy of the Document Reader still exists.
cors.allowed.origins=http://localhost:4300,http://localhost:4200

# --- Vessel tracking (Data Docked) ---
# Real key, read from an environment variable only - never committed here.
# Set DATADOCKED_API_KEY before starting the JAR, same as OPENSANCTIONS_API_KEY.
# Credit costs matter here (20-credit trial budget as of 2026-09-08):
# port-calls-by-vessel = 1 credit/call, get-vessel-location = 1, get-vessel-particulars = 1,
# get-vessels-ban-list = 15 (not called live - see Phase 3 in FEATURES.md).
datadocked.api.url=https://datadocked.com/api/vessels_operations
datadocked.api.key=${DATADOCKED_API_KEY:}
modules.vesseltracking.enabled=true
